name: Todo CI

on:
  push:
    paths:
      - "services/todo/**"
  pull_request:
    paths:
      - "services/todo/**"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"

      - name: Run tests
        working-directory: services/todo
        run: go test ./...

      - name: Build
        working-directory: services/todo
        run: go build ./...