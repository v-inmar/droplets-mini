name: Gateway CI

on:
  push:
    branches:
      - main
    paths:
      - "services/gateway/**"
  pull_request:
    branches:
      - main
    paths:
      - "services/gateway/**"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"

      - name: Run tests
        working-directory: services/gateway
        run: go test ./...

      - name: Build
        working-directory: services/gateway
        run: go build ./...
