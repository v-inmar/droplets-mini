services:
  history:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: droplets_history
    
    env_file:
      - .docker.env
    ports:
      - "5502:5502"
    
    networks:
      - event_network
      - gateway_network
      - historydb_network



networks:
  gateway_network:
    external: true
  historydb_network:
    external: true
  event_network:
    external: true