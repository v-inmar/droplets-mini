services:
  todo:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: droplets_todo
    
    env_file:
      - .docker.env
    ports:
      - "5501:5501"
    
    networks:
      - event_network
      - gateway_network
      - tododb_network



networks:
  gateway_network:
    external: true
  tododb_network:
    external: true
  event_network:
    external: true